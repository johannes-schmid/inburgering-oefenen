name: IndexNow (na productiedeploy)

# Na een push naar main wachten we op Vercels productiedeploy van die commit (Vercel meldt hem als
# GitHub-deployment) en melden dan de URL's die nieuw zijn in de sitemap bij IndexNow. De lijst van
# de vorige keer staat in de actions-cache en niet in de repo: een commit vanuit deze workflow zou
# zelf weer een deploy starten. Niet `on: deployment_status` — dat event hangt niet aan een ref,
# en dan weigert actions/cache te lezen én te schrijven.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      urls:
        description: "Paden of URL's, gescheiden door spaties (leeg = alleen nieuwe URL's)"
        type: string
        default: ''
      all:
        description: 'De hele sitemap (alleen eenmalig, of na een grote verbouwing)'
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wachten op de productiedeploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 90); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&environment=Production" --jq '.[0].id // empty')
            if [ -n "$ID" ]; then
              STATE=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" --jq '.[0].state // empty')
              echo "deploy $ID: ${STATE:-nog geen status}"
              case "$STATE" in
                success) exit 0 ;;
                failure|error|inactive) echo "productiedeploy niet gelukt"; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "geen productiedeploy binnen 15 minuten"; exit 1
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/indexnow.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - name: Melden
        env:
          URLS: ${{ inputs.urls }}
          ALL: ${{ inputs.all }}
        run: |
          if [ -n "$URLS" ]; then
            node scripts/indexnow.mjs $URLS
          elif [ "$ALL" = "true" ]; then
            node scripts/indexnow.mjs --all --state indexnow-state.json
          else
            node scripts/indexnow.mjs --new --state indexnow-state.json
          fi
      - uses: actions/cache/save@v4
        if: hashFiles('indexnow-state.json') != ''
        with:
          path: indexnow-state.json
          key: indexnow-${{ github.run_id }}
