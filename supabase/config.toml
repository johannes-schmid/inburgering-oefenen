project_id = "inburgering-oefenen"

[api]
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
# Postgres 17, matching the hosted project. The CLI stopped honouring `major_version = 15`
# and forces 17 locally, which stranded the old PG15 volume ("database files are incompatible
# with server"). Aligning here is the fix, not a preference.
major_version = 17

[studio]
port = 54423

[inbucket]
port = 54424
smtp_port = 54425
pop3_port = 54426

# Ports are shifted into the 544xx block so this stack can run at the same time as the
# knm-website stack, which keeps the default 543xx block.
[analytics]
enabled = true
port = 54427

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:3001"
# `/auth/callback` must be listed explicitly (or via the wildcard): Supabase matches the
# redirect_to it is handed, and `http://localhost:3001` alone does not cover a sub-path — the
# Google round-trip fails with "requested path is invalid" without this.
additional_redirect_urls = ["http://localhost:3001/**", "http://127.0.0.1:3001/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# De OAuth 2.1-server van Supabase Auth is de autorisatieserver voor de ChatGPT-app (MCP).
# ChatGPT registreert zichzelf dynamisch (DCR) en stuurt de kandidaat naar onze eigen
# toestemmingspagina; het toegangstoken dat eruit komt is een gewone Supabase-gebruikers-JWT,
# dus RLS en `ownsModule()` werken ongewijzigd. Zie docs/chatgpt-app/DEVELOPER.md.
[auth.oauth_server]
enabled = true
authorization_url_path = "/nl/oauth/consent"
allow_dynamic_registration = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

# Wachtwoord-login alleen voor het reviewer-account van de OpenAI-review; zie de migratie
# 20261005090000_reviewer_login.sql. Op het gehoste project staat dezelfde hook in het dashboard.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/hook_reviewer_claims"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_google_only_signup"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
