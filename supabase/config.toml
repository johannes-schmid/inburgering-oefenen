project_id = "inburgering-oefenen"

[api]
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 15

[studio]
port = 54423

[inbucket]
port = 54424
smtp_port = 54425
pop3_port = 54426

# Ports are shifted into the 544xx block so this stack can run at the same time as the
# knm-website stack, which keeps the default 543xx block.
[analytics]
enabled = true
port = 54427

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:3001"
additional_redirect_urls = ["https://localhost:3000", "http://localhost:3000", "http://localhost:3001", "http://localhost:3001/dashboard"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
